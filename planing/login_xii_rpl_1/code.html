<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Administrasi Kelas XII RPL 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed-variant": "#005236",
                      "on-primary-container": "#dad7ff",
                      "surface-variant": "#dce2f3",
                      "on-tertiary-fixed-variant": "#653e00",
                      "inverse-surface": "#2a313d",
                      "surface-container-low": "#f0f3ff",
                      "error": "#ba1a1a",
                      "tertiary": "#684000",
                      "tertiary-container": "#885500",
                      "surface-tint": "#4d44e3",
                      "on-tertiary": "#ffffff",
                      "on-error-container": "#93000a",
                      "surface-container-lowest": "#ffffff",
                      "outline": "#777587",
                      "on-background": "#151c27",
                      "secondary": "#006c49",
                      "on-primary-fixed": "#0f0069",
                      "on-tertiary-fixed": "#2a1700",
                      "surface-container": "#e7eefe",
                      "inverse-on-surface": "#ebf1ff",
                      "on-secondary-container": "#00714d",
                      "secondary-fixed": "#6ffbbe",
                      "background": "#f9f9ff",
                      "surface": "#f9f9ff",
                      "on-tertiary-container": "#ffd4a4",
                      "surface-dim": "#d3daea",
                      "secondary-container": "#6cf8bb",
                      "on-surface-variant": "#464555",
                      "error-container": "#ffdad6",
                      "on-surface": "#151c27",
                      "surface-container-highest": "#dce2f3",
                      "on-secondary-fixed": "#002113",
                      "on-primary-fixed-variant": "#3323cc",
                      "tertiary-fixed-dim": "#ffb95f",
                      "primary": "#3525cd",
                      "surface-bright": "#f9f9ff",
                      "primary-fixed": "#e2dfff",
                      "surface-container-high": "#e2e8f8",
                      "primary-fixed-dim": "#c3c0ff",
                      "tertiary-fixed": "#ffddb8",
                      "inverse-primary": "#c3c0ff",
                      "on-primary": "#ffffff",
                      "secondary-fixed-dim": "#4edea3",
                      "outline-variant": "#c7c4d8",
                      "on-secondary": "#ffffff",
                      "on-error": "#ffffff",
                      "primary-container": "#4f46e5"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "md": "16px",
                      "lg": "24px",
                      "margin-mobile": "16px",
                      "max-width": "1440px",
                      "sm": "8px",
                      "margin-desktop": "32px",
                      "xs": "4px",
                      "gutter": "16px",
                      "base": "4px",
                      "xl": "32px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "title-lg": ["Inter"],
                      "body-sm": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-sm": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-on-background">
<!-- Shader Background -->

<!-- Main Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Login Card -->
<div class="bg-surface/95 backdrop-blur-xl border border-outline-variant rounded-xl p-lg md:p-xl shadow-[0_20px_25px_-5px_rgb(0,0,0,0.1)]">
<!-- Header -->
<div class="text-center mb-xl">
<div class="w-16 h-16 mx-auto bg-primary-container rounded-full flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-4xl filled-icon" data-icon="school">school</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Aplikasi Administrasi Kelas</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">XII RPL 1 · 2025/2026</p>
</div>
<!-- Form -->
<form class="space-y-md" onsubmit="event.preventDefault(); showToast();">
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="username">Username / NIS</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="person">person</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-3 py-2 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-md text-body-md h-12" id="username" placeholder="Masukkan username atau NIS" required="" type="text"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="lock">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-10 py-2 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-md text-body-md h-12" id="password" placeholder="Masukkan password" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-sm space-y-md">
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-title-lg text-title-lg rounded-lg h-12 flex items-center justify-center transition-colors shadow-sm" type="submit">
                        Masuk sebagai Admin
                    </button>
<button class="w-full bg-surface hover:bg-surface-variant border border-outline-variant text-on-surface-variant font-title-lg text-title-lg rounded-lg h-12 flex items-center justify-center transition-colors" onclick="showToast()" type="button">
                        Masuk sebagai Siswa
                    </button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-lg text-center">
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">
                    Lupa password? Hub. Admin
                </a>
</div>
</div>
</main>
<!-- Toast Notification (Hidden by default) -->
<div class="fixed bottom-margin-mobile left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-lg py-md rounded-lg shadow-[0_20px_25px_-5px_rgb(0,0,0,0.1)] flex items-center gap-sm transform translate-y-[150%] opacity-0 transition-all duration-300 z-50" id="toast">
<span class="material-symbols-outlined text-secondary-fixed filled-icon" data-icon="check_circle">check_circle</span>
<span class="font-body-md text-body-md">Login successful. Mengalihkan...</span>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-[150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[150%]', 'opacity-0');
            }, 3000);
        }
    </script>
</body></html>
