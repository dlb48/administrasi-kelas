name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan Anda memicu build ini secara manual dari halaman GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Build Web App
        working-directory: ./app
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./app
        run: npx cap sync android

      - name: Build APK
        working-directory: ./app/android
        run: |
          sudo apt-get install -y dos2unix
          dos2unix ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-administrasi-kelas
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
